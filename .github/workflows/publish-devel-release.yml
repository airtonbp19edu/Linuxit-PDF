name: Publish tested development release (manual)

# Publishes an already tested Flatpak candidate as a GitHub prerelease without
# rebuilding it. The bundle is taken from the artifact of the candidate run and
# must match releases/manifest-<version>.json byte for byte (size and SHA-256).
# Run by the repository owner from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (releases/manifest-<version>.json must exist)
        required: true
        default: '0.1.17'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out manifests and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the tested candidate identity
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ['VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          m = json.load(open(f'releases/manifest-{version}.json'))
          run_id = m['ci_run_url'].rstrip('/').rsplit('/', 1)[1]
          assert m['version'] == version and m['flatpak_branch'] == 'devel' and run_id.isdigit()
          assert m['distribution']['tag'] == f'v{version}-devel'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run_id={run_id}\nsha={m['artifact']['sha256']}\nbytes={m['artifact']['bytes']}\n")
              out.write(f"file={m['artifact']['file']}\ncommit={m['source_commit']}\ntag={m['distribution']['tag']}\n")
          PY
      - name: Download the tested artifact (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linuxit-linux-${{ steps.manifest.outputs.commit }}
          run-id: ${{ steps.manifest.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify bytes against the manifest
        run: |
          file="candidate/dist/${{ steps.manifest.outputs.file }}"
          test "$(stat -c %s "$file")" = "${{ steps.manifest.outputs.bytes }}"
          echo "${{ steps.manifest.outputs.sha }}  $file" | sha256sum -c -
      - name: Create the prerelease (draft) and upload the bundle
        # The job token cannot create the tag on the tested commit: that commit's workflow
        # files differ from main, and creating such a ref needs the "workflows" permission,
        # which GITHUB_TOKEN never has (run 39485174222: HTTP 403). So the release is created
        # as a draft (no tag yet); the owner publishes it in the web page, which creates the tag
        # on the tested commit with the owner's own permission. If the tag already exists and
        # points at the tested commit, the release is published directly on it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          COMMIT: ${{ steps.manifest.outputs.commit }}
        run: |
          file="candidate/dist/${{ steps.manifest.outputs.file }}"
          existing=""
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            existing="$(python3 -c "import json;print(json.load(open('tag.json'))['object']['sha'])")"
          fi
          if [ -n "$existing" ]; then
            test "$existing" = "$COMMIT" || { echo "Tag $TAG points to $existing, not the tested $COMMIT"; exit 1; }
            gh release create "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Linuxit PDF ${{ inputs.version }} — desenvolvimento" \
              --notes-file "releases/notes-${{ inputs.version }}.md" --prerelease
          else
            gh release create "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --draft \
              --title "Linuxit PDF ${{ inputs.version }} — desenvolvimento" \
              --notes-file "releases/notes-${{ inputs.version }}.md" --prerelease
            echo "::notice::Rascunho criado. Abra Releases, edite o rascunho $TAG e clique em Publish release."
          fi
