name: Publish tested development release (manual)

# Publishes an already tested Flatpak candidate as a GitHub prerelease without
# rebuilding it. The bundle is taken from the artifact of the candidate run and
# must match releases/manifest-<version>.json byte for byte (size and SHA-256).
# Run by the repository owner from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (releases/manifest-<version>.json must exist)
        required: true
        default: '0.1.17'
      check_only:
        description: Conferir o plano sem criar release, tag ou anexar arquivos
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-development-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out manifests and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the tested candidate identity
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ['VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          m = json.load(open(f'releases/manifest-{version}.json'))
          run_id = m['ci_run_url'].rstrip('/').rsplit('/', 1)[1]
          assert m['version'] == version and m['flatpak_branch'] == 'devel' and run_id.isdigit()
          assert m['distribution']['tag'] == f'v{version}-devel'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run_id={run_id}\nsha={m['artifact']['sha256']}\nbytes={m['artifact']['bytes']}\n")
              out.write(f"file={m['artifact']['file']}\ncommit={m['source_commit']}\ntag={m['distribution']['tag']}\n")
          PY
      - name: Check permissions, target, existing tag and asset (read only)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release_preflight.py --manifest "releases/manifest-$VERSION.json" --output release-plan.json
      - name: Check publication guards
        run: python3 -m unittest tests.test_release_preflight -v
      - name: Download the tested artifact (no rebuild)
        if: ${{ !inputs.check_only && (steps.plan.outputs.mode == 'create_release' || steps.plan.outputs.mode == 'upload_draft') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linuxit-linux-${{ steps.manifest.outputs.commit }}
          run-id: ${{ steps.manifest.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify bytes against the manifest
        if: ${{ !inputs.check_only && (steps.plan.outputs.mode == 'create_release' || steps.plan.outputs.mode == 'upload_draft') }}
        run: |
          file="candidate/dist/${{ steps.manifest.outputs.file }}"
          test "$(stat -c %s "$file")" = "${{ steps.manifest.outputs.bytes }}"
          echo "${{ steps.manifest.outputs.sha }}  $file" | sha256sum -c -
      - name: Publish eligible candidate or upload only to the owner's draft
        if: ${{ !inputs.check_only && (steps.plan.outputs.mode == 'create_release' || steps.plan.outputs.mode == 'upload_draft') }}
        # E29 confirmed that the restriction also applies to draft creation, regardless
        # of tag creation. Never substitute main for the tested commit to avoid the 403.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          COMMIT: ${{ steps.manifest.outputs.commit }}
          BYTES: ${{ steps.manifest.outputs.bytes }}
          MODE: ${{ steps.plan.outputs.mode }}
          DRAFT_ID: ${{ steps.plan.outputs.release_id }}
        run: |
          file="candidate/dist/${{ steps.manifest.outputs.file }}"
          if [ "$MODE" = 'upload_draft' ]; then
            # Recheck identity immediately before upload; never edit a published release.
            gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" > draft.json
            python3 -c "import json,os;r=json.load(open('draft.json'));assert r['draft'] and r['tag_name']==os.environ['TAG'] and r['target_commitish']==os.environ['COMMIT']"
            name="$(basename "$file")"
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID/assets?name=$name" > asset.json
            python3 -c "import json,os;a=json.load(open('asset.json'));assert a['size']==int(os.environ['BYTES']) and a['state']=='uploaded',a;print('asset',a['id'],a['size'],a.get('digest'))"
            echo "::notice::Pacote anexado ao rascunho $TAG. Publique o rascunho na página Releases."
            exit 0
          fi
          test "$MODE" = 'create_release'
          gh release create "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "Linuxit PDF ${{ inputs.version }} — desenvolvimento" \
            --notes-file "releases/notes-${{ inputs.version }}.md" --prerelease
      - name: Preserve read-only publication plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          if-no-files-found: warn
