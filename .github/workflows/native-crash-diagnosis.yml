name: Native crash diagnosis (manual)

# Repeats the own suite in parallel Debian 13 shards to catch an intermittent
# native GTK crash with Python stacks (scripts/diagnose_native_crash.py).
# Diagnostic only: it never publishes results as validation of a revision.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Suite repetitions per shard
        default: '3'
      pattern:
        description: unittest file pattern
        default: 'test*.py'
      fatal_criticals:
        description: Stop at the first GLib/GTK critical (true/false)
        default: 'true'

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: debian:13
    steps:
      - name: Install source test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-gi python3-cairo python3-gi-cairo \
            python3-pil python3-cryptography python3-asn1crypto gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gtk3 gstreamer1.0-libav gir1.2-gtk-3.0 gir1.2-poppler-0.18 poppler-utils cups-client \
            dbus dbus-x11 xvfb xauth openbox fonts-dejavu-core adwaita-icon-theme openssl \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng espeak-ng \
            at-spi2-core libatk-adaptor gir1.2-atspi-2.0 \
            xdg-desktop-portal xdg-desktop-portal-gtk xdotool
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare test user
        run: |
          useradd --create-home --uid 1001 linuxit-test
          chown -R linuxit-test:linuxit-test "$GITHUB_WORKSPACE"
      - name: Repeat the suite
        env:
          REPEATS: ${{ inputs.repeats }}
          PATTERN: ${{ inputs.pattern }}
          FATAL: ${{ inputs.fatal_criticals }}
        run: |
          runuser -u linuxit-test -- bash -c '
            cd "$GITHUB_WORKSPACE"
            export LINUXIT_SEARCH_CAPTURE_DIR="$GITHUB_WORKSPACE/dist/crash-diagnosis/captures"
            export XDG_RUNTIME_DIR="$(mktemp -d /tmp/linuxit-crash-XXXXXX)"
            chmod 700 "$XDG_RUNTIME_DIR"
            flag=""; [ "$FATAL" = "true" ] && flag="--fatal-criticals"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/diagnose_native_crash.py \
              --repeats "$REPEATS" --pattern "$PATTERN" $flag \
              --output-dir dist/crash-diagnosis/shard-${{ matrix.shard }}
          '
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linuxit-crash-diagnosis-${{ matrix.shard }}-${{ github.sha }}
          path: dist/crash-diagnosis/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
