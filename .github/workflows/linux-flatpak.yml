name: Linux source and Flatpak candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linuxit-flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: debian:13
      # Needed for the nested Flatpak sandbox on this ephemeral hosted runner.
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build and GUI test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-gi python3-cairo python3-gi-cairo \
            python3-pil python3-cryptography python3-asn1crypto gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gtk3 gstreamer1.0-libav python3-cffi python3-pycparser \
            gir1.2-gtk-3.0 gir1.2-poppler-0.18 poppler-utils cups-client flatpak bubblewrap \
            dbus dbus-x11 xvfb xauth x11-utils openbox fonts-dejavu-core \
            adwaita-icon-theme librsvg2-common shared-mime-info libglib2.0-bin openssl appstream \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng espeak-ng \
            at-spi2-core libatk-adaptor gir1.2-atspi-2.0
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated CI user and system bus
        run: |
          useradd --create-home --uid 1001 linuxit-ci
          chown -R linuxit-ci:linuxit-ci "$GITHUB_WORKSPACE"
          mkdir -p /run/dbus
          dbus-uuidgen --ensure
          dbus-daemon --system --fork --nopidfile
      - name: Validate source, build and test candidate
        run: |
          runuser -u linuxit-ci -- bash -c '
            cd "$GITHUB_WORKSPACE"
            export XDG_RUNTIME_DIR="$(mktemp -d /tmp/linuxit-runtime-XXXXXX)"
            chmod 700 "$XDG_RUNTIME_DIR"
            exec dbus-run-session -- xvfb-run -a bash scripts/ci_linux_flatpak.sh
          '
      - name: Preserve reports and candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linuxit-linux-${{ github.sha }}
          path: |
            dist/ci-results/
            dist/LinuxitPDF-*-x86_64.flatpak
            analysis-local/ci-source/*.stderr
            analysis-local/ci-source/*.stdout
          if-no-files-found: warn
          retention-days: 14
