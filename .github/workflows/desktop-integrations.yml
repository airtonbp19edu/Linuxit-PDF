name: Own installed desktop integrations
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Optional completed linux-flatpak run whose unpublished candidate is tested'
        required: false
        default: ''
      probe:
        description: 'Desktop acceptance or offline TLS trust prerequisite'
        type: choice
        options:
          - desktop
          - tls
          - desktop-and-tls
        default: desktop
permissions:
  contents: read
  actions: read
jobs:
  own-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Install ephemeral desktop dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 python3-gi gir1.2-glib-2.0 flatpak bubblewrap dbus dbus-x11 xvfb xauth openbox xdotool xdg-desktop-portal xdg-desktop-portal-gtk fuse3 shared-mime-info desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download selected unpublished test candidate
        if: ${{ inputs.candidate_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: linuxit-linux-*
          merge-multiple: true
          path: analysis-local/desktop-candidate
      - name: Prepare isolated user and system bus
        run: |
          useradd --create-home --uid 1001 linuxit-desktop
          chown -R linuxit-desktop:linuxit-desktop "$GITHUB_WORKSPACE"
          mkdir -p /run/dbus
          dbus-uuidgen --ensure
          dbus-daemon --system --fork --nopidfile
      - name: Check actual installed update, rollback, portal persistence and association
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PROBE: ${{ inputs.probe }}
        run: |
          runuser -u linuxit-desktop -- bash -c '
            set -e
            cd "$GITHUB_WORKSPACE"
            mkdir -p dist/desktop-results analysis-local
            export XDG_RUNTIME_DIR="$(mktemp -d /tmp/linuxit-desktop-XXXXXX)"
            chmod 700 "$XDG_RUNTIME_DIR"
            export LINUXIT_EPHEMERAL_DESKTOP=1
            export XDG_CURRENT_DESKTOP=GNOME
            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user --noninteractive -y --no-related flathub org.freedesktop.Platform//25.08 >dist/desktop-results/runtime-install.log 2>&1
            candidate_args=()
            if [ -n "$CANDIDATE_RUN_ID" ]; then
              mapfile -t manifests < <(find analysis-local/desktop-candidate -name candidate.json -type f)
              mapfile -t bundles < <(find analysis-local/desktop-candidate -name "LinuxitPDF-*-x86_64.flatpak" -type f)
              [ "${#manifests[@]}" -eq 1 ] && [ "${#bundles[@]}" -eq 1 ]
              candidate_args=(--candidate-manifest "${manifests[0]}" --candidate-bundle "${bundles[0]}")
            fi
            if [ "$PROBE" = tls ]; then
              [ -n "$CANDIDATE_RUN_ID" ]
              exec dbus-run-session -- /usr/bin/python3 scripts/check_flatpak_tls.py --output dist/desktop-results/tls-trust.json "${candidate_args[@]}"
            fi
            xvfb-run -a dbus-run-session -- bash scripts/run_desktop_probe.sh --output dist/desktop-results/integrations.json "${candidate_args[@]}"
            if [ "$PROBE" = desktop-and-tls ]; then
              [ -n "$CANDIDATE_RUN_ID" ]
              dbus-run-session -- /usr/bin/python3 scripts/check_flatpak_tls.py --output dist/desktop-results/tls-trust.json "${candidate_args[@]}"
            fi
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linuxit-own-desktop-${{ github.sha }}-repetition-${{ matrix.repetition }}
          path: dist/desktop-results/
          if-no-files-found: warn
          retention-days: 14
